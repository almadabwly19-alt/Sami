
name: Turath Developer - Full Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turath-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Turath Developer APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Check project generator
        run: |
          test -f setup.sh || {
            echo "ERROR: setup.sh is missing"
            exit 1
          }
          chmod +x setup.sh

      - name: Generate complete Android project
        run: bash setup.sh

      - name: Verify Android project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/turath/app/MainActivity.kt

      - name: Prepare OCR Arabic data
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L --fail --retry 3 \
            -o app/src/main/assets/tessdata/ara.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata
          test -s app/src/main/assets/tessdata/ara.traineddata

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: false

      - name: Validate project configuration
        run: gradle tasks --no-daemon

      - name: Build debug APK
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Turath-Developer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Turath-Build-Reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
defaults:
  
